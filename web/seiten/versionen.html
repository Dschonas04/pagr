{{define "inhalt"}}
{{$s := .D.S}}
<div class="leiste"><h1>Versionen: {{$s.Titel}}</h1><a class="knopf" href="/admin/seite/{{$s.ID}}">Zurück zur Seite</a></div>
{{range .D.Versionen}}
<details class="karte" style="margin-bottom:8px">
  <summary><strong>{{datum .Erstellt}}</strong> · {{.Titel}}{{if .Verfasser}} · {{.Verfasser}}{{end}}</summary>
  <pre class="code" style="white-space:pre-wrap;max-height:400px">{{.Inhalt}}</pre>
  <div class="leiste eng"><a class="knopf" href="/admin/seite/{{$s.ID}}/vergleich/{{.ID}}">Mit jetzt vergleichen</a><a class="knopf" href="/admin/seite/{{$s.ID}}?version={{.ID}}">Diese Version bearbeiten</a></div>
</details>
{{else}}<div class="leer">Noch keine Versionen.</div>{{end}}
{{end}}
