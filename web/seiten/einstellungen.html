{{define "inhalt"}}
<div class="leiste"><h1>Einstellungen</h1><a class="knopf" href="/admin/export">Website als ZIP</a><a class="knopf" href="/admin/personen">Personen</a><a class="knopf" href="/sso/konten">Konten</a></div>
<form method="post" action="/admin/einstellungen" class="karte" style="max-width:640px">
  <input type="hidden" name="token" value="{{.Token}}">
  <label for="titel">Name der Website</label><input type="text" id="titel" name="titel" value="{{index .D.W "titel"}}">
  <label for="untertitel">Untertitel</label><input type="text" id="untertitel" name="untertitel" value="{{index .D.W "untertitel"}}">
  <label for="fuss">Fußzeile (einfacher Text)</label><input type="text" id="fuss" name="fuss" value="{{index .D.W "fuss"}}">
  {{$design := index .D.W "design"}}{{$sprache := index .D.W "sprache"}}
  <div class="feld-reihe">
    <div><label for="design">Design</label><select id="design" name="design">
      <option value="">Ruhig</option><option value="klar"{{if eq $design "klar"}} selected{{end}}>Klar</option><option value="magazin"{{if eq $design "magazin"}} selected{{end}}>Magazin</option></select></div>
    <div><label for="sprache">Hauptsprache</label><select id="sprache" name="sprache">
      {{range .D.Sprachen}}<option{{if eq . $sprache}} selected{{end}}>{{.}}</option>{{end}}</select></div>
  </div>
  <label for="adresse">Öffentliche Adresse (für Sitemap), z. B. https://www.example.org</label><input type="url" id="adresse" name="adresse" value="{{index .D.W "adresse"}}">
  <div style="margin-top:16px"><button class="primaer">Speichern</button></div>
</form>
{{end}}
